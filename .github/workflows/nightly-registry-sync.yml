name: Nightly Registry Sync

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: magic-ui-nightly-registry-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Rebuild registries and open missing-component issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SparkUI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild registries
        run: pnpm sync:magic-ui

      - name: Create or refresh agent issues
        run: pnpm sync:magic-ui:issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_ASSIGNEE: ${{ vars.COPILOT_AGENT_ASSIGNEE || 'copilot' }}

      - name: Commit registry updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry
          git diff --cached --quiet || git commit -m "chore: sync MagicUI registry"
          git push
